<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f2ea"/>
      <stop offset="1" stop-color="#e0d2ba"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9aa0a8"/>
      <stop offset="1" stop-color="#5a5f68"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8c98a"/>
      <stop offset="1" stop-color="#a8843f"/>
    </linearGradient>
    <linearGradient id="plastic" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2f1e"/>
      <stop offset="1" stop-color="#1c1610"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="5" stdDeviation="7" flood-color="#5a4a30" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bg)"/>

  <!-- Верстак -->
  <rect x="0" y="420" width="800" height="180" fill="#8a6a3a"/>
  <rect x="0" y="415" width="800" height="12" fill="#a8843f"/>
  <rect x="40" y="470" width="40" height="130" fill="#6a4a2a"/>
  <rect x="720" y="470" width="40" height="130" fill="#6a4a2a"/>

  <!-- Кошемашина на столе (в разобранном виде) -->
  <g filter="url(#shadow)">
    <!-- корпус без крышки -->
    <rect x="250" y="270" width="220" height="120" rx="8" fill="url(#plastic)" stroke="#5a4a30" stroke-width="2"/>
    <!-- внутренности видны: -->
    <rect x="265" y="285" width="70" height="40" rx="5" fill="url(#steel)"/>
    <rect x="345" y="285" width="50" height="40" rx="5" fill="#2a2015"/>
    <circle cx="385" cy="305" r="16" fill="none" stroke="url(#gold)" stroke-width="3"/>
    <rect x="265" y="335" width="110" height="30" rx="4" fill="url(#steel)"/>
    <!-- трубки -->
    <path d="M 340 335 Q 380 350 420 330" fill="none" stroke="#c0564a" stroke-width="4"/>
    <path d="M 270 320 Q 240 340 250 360" fill="none" stroke="#c0564a" stroke-width="4"/>
  </g>

  <!-- Снятая крышка рядом -->
  <g filter="url(#shadow)">
    <rect x="500" y="380" width="150" height="40" rx="6" fill="url(#plastic)" stroke="#5a4a30" stroke-width="1.5" transform="rotate(-8, 575, 400)"/>
    <rect x="520" y="388" width="60" height="12" rx="3" fill="#14351f" transform="rotate(-8, 575, 400)"/>
  </g>
  <text x="575" y="440" text-anchor="middle" font-family="Arial" font-size="11" fill="#7a6f5e">Снятая крышка</text>

  <!-- Детали на столе: блок, жернова, кольца -->
  <g filter="url(#shadow)">
    <rect x="120" y="395" width="90" height="50" rx="6" fill="url(#plastic)" stroke="#5a4a30" stroke-width="1.5"/>
    <circle cx="200" cy="415" r="14" fill="url(#gold)"/>
    <circle cx="200" cy="415" r="4" fill="#5a4a30"/>
  </g>
  <text x="165" y="470" text-anchor="middle" font-family="Arial" font-size="11" fill="#7a6f5e">Заваривающий блок</text>

  <!-- Кольца O-ring -->
  <g>
    <circle cx="280" cy="455" r="12" fill="none" stroke="#3d4a35" stroke-width="4"/>
    <circle cx="310" cy="455" r="9" fill="none" stroke="#3d4a35" stroke-width="4"/>
    <circle cx="335" cy="455" r="7" fill="none" stroke="#3d4a35" stroke-width="4"/>
  </g>
  <text x="308" y="480" text-anchor="middle" font-family="Arial" font-size="11" fill="#7a6f5e">O-ring</text>

  <!-- Жернова -->
  <g filter="url(#shadow)">
    <circle cx="420" cy="450" r="18" fill="url(#steel)" stroke="#3a3f48" stroke-width="2"/>
    <circle cx="420" cy="450" r="10" fill="none" stroke="url(#gold)" stroke-width="2"/>
  </g>
  <text x="420" y="482" text-anchor="middle" font-family="Arial" font-size="11" fill="#7a6f5e">Жернова</text>

  <!-- МАСТЕР (человек) -->
  <g>
    <!-- тело -->
    <ellipse cx="105" cy="330" rx="45" ry="60" fill="#3d5a6a"/>
    <!-- голова -->
    <circle cx="105" cy="240" r="28" fill="#e8c9a8"/>
    <!-- волосы -->
    <path d="M 77 235 Q 105 200 133 235 Q 125 220 105 218 Q 85 220 77 235 Z" fill="#3a2f28"/>
    <!-- руки -->
    <path d="M 60 300 Q 130 320 200 330" stroke="#3d5a6a" stroke-width="22" fill="none" stroke-linecap="round"/>
    <!-- рука с отвёрткой -->
    <line x1="185" y1="328" x2="225" y2="345" stroke="#e8c9a8" stroke-width="12" stroke-linecap="round"/>
    <line x1="222" y1="342" x2="255" y2="355" stroke="#5a5f68" stroke-width="5" stroke-linecap="round"/>
    <rect x="248" y="352" width="30" height="10" rx="3" fill="#8a6430" transform="rotate(22, 263, 357)"/>
    <!-- ноги -->
    <rect x="80" y="385" width="22" height="35" rx="4" fill="#2a3a48"/>
    <rect x="108" y="385" width="22" height="35" rx="4" fill="#2a3a48"/>
    <!-- фартук -->
    <rect x="70" y="280" width="70" height="90" rx="6" fill="#2a4a3a"/>
  </g>

  <!-- Ящик с инструментами -->
  <g filter="url(#shadow)">
    <rect x="660" y="360" width="110" height="55" rx="6" fill="#c0564a" stroke="#8a3a30" stroke-width="2"/>
    <rect x="675" y="368" width="80" height="10" rx="3" fill="#e8c9a8"/>
    <rect x="690" y="385" width="14" height="10" rx="2" fill="url(#steel)"/>
    <rect x="710" y="385" width="14" height="10" rx="2" fill="url(#steel)"/>
    <rect x="730" y="385" width="14" height="10" rx="2" fill="url(#steel)"/>
  </g>
  <text x="715" y="435" text-anchor="middle" font-family="Arial" font-size="11" fill="#7a6f5e">Инструменты</text>

  <!-- Подпись -->
  <text x="400" y="45" text-anchor="middle" font-family="Georgia, serif" font-size="22" font-weight="bold" fill="#33291c">Ремонт кофемашины в нашей мастерской</text>
  <text x="400" y="65" text-anchor="middle" font-family="Arial" font-size="12" fill="#7a6f5e">Диагностика · разборка · замена узлов · сборка · тест</text>

  <!-- Шапка-плашка -->
  <rect x="30" y="80" width="740" height="50" rx="10" fill="#33291c" opacity="0.9"/>
  <text x="400" y="110" text-anchor="middle" font-family="Arial" font-size="15" fill="#e8c98a">🔧 Работаем на столе — не на полу, чисто и аккуратно</text>

  <!-- Лампа -->
  <g>
    <line x1="560" y1="90" x2="560" y2="160" stroke="#5a4a30" stroke-width="4"/>
    <circle cx="560" cy="75" r="18" fill="url(#gold)"/>
    <path d="M 540 70 L 580 70 L 575 95 L 545 95 Z" fill="#fff3d0" opacity="0.8"/>
  </g>
</svg>
